<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه ساده من</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f5e8ff);
      color: #1f2937;
    }
    .card {
      width: min(90%, 420px);
      padding: 32px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 35px #33415520;
    }
    h1 { margin-top: 0; color: #6d28d9; }
    p { line-height: 1.9; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      background: #6d28d9;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #5b21b6; }
    #message { min-height: 28px; color: #6d28d9; font-weight: bold; }
  </style>
</head>
<body>
  <main class="card">
    <h1>سلام! 👋</h1>
    <p>به اولین صفحه HTML من خوش آمدی.</p>
    <button id="helloButton">روی من کلیک کن</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById('helloButton').addEventListener('click', () => {
      document.getElementById('message').textContent = 'آفرین! دکمه کار می‌کند 🎉';
    });
  </script>
</body>
</html>
